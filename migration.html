<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One year of migration</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    /* The animation view's own tokens, so the two pages are plainly the same
       piece of software - the control bar here had drifted into generic grey
       while the map beside it was lime and amber on satellite. */
    --accent: #a9e34b;
    --ink: #f4f2ee;
    --panel: rgba(10, 12, 16, .72);
    --hair: rgba(255, 255, 255, .14);
    margin: 0; background: #07090c; color: var(--ink); overflow: hidden;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #frame { position: relative; box-shadow: 0 24px 80px rgba(0,0,0,.6); }
  /* Filling the screen is the normal case; a fixed export shape is the
     special one. Letterboxing a phone to 4:5 wasted half the display. */
  body.fit #frame { box-shadow: none; }
  canvas { display: block; touch-action: none; }

  #bar {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; z-index: 20;
    /* It used to be a single rigid row and ran off both edges of a phone. */
    flex-wrap: wrap; justify-content: center;
    max-width: calc(100vw - 20px);
    padding: 9px 14px; border-radius: 16px;
    background: var(--panel); border: 1px solid var(--hair);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
  }
  button {
    font: inherit; color: var(--ink); background: rgba(255,255,255,.07);
    border: 1px solid var(--hair); border-radius: 9px;
    padding: 6px 12px; cursor: pointer; transition: background .12s;
  }
  button:hover { background: rgba(255,255,255,.15); }
  #play { min-width: 74px; font-weight: 600; }
  select { font: inherit; color: var(--ink); background: rgba(255,255,255,.06);
    border: 1px solid var(--hair); border-radius: 9px; padding: 5px 9px; }
  /* The scrubber takes the accent, as it does on the animation view. */
  input[type=range] {
    -webkit-appearance: none; appearance: none; background: transparent;
    height: 20px;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px; background: rgba(255,255,255,.18);
  }
  input[type=range]::-moz-range-track {
    height: 4px; border-radius: 2px; background: rgba(255,255,255,.18);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; margin-top: -6px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 0; cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 0; cursor: pointer;
  }
  input[type=range] { padding: 0; width: 190px; max-width: 46vw; }
  #species { max-width: min(200px, 44vw); }
  #nav { position: fixed; top: 14px; left: 16px; }

  @media (max-width: 620px) {
    /* Pinned to the foot of the screen rather than floating above it, and the
       secondary controls folded away behind the ellipsis - four rows of chrome
       over a map is not a viewer. */
    #bar {
      left: 0; right: 0; bottom: 0; transform: none; max-width: none;
      border-radius: 14px 14px 0 0; gap: 8px; padding: 8px 10px 10px;
      font-size: 13px;
    }
    button, select { padding: 5px 9px; }
    .lbl { font-size: 11px; }
    input[type=range] { width: 100%; order: 10; max-width: none; }
    #species { max-width: 42vw; }
    body:not(.more) #basemap,
    body:not(.more) #size { display: none; }
  }
  /* On a wide screen there is room for everything, so the toggle is noise. */
  @media (min-width: 621px) { #more { display: none; } }
  .lbl { font-size: 12px; color: rgba(244,242,238,.62); font-variant-numeric: tabular-nums; }
  /* It opened as a page with no way off it. */
  #nav {
    position: fixed; top: 14px; left: 16px; z-index: 30; display: flex;
    gap: 14px; align-items: center; font-size: 13px;
  }
  #nav a { color: rgba(244,242,238,.62); text-decoration: none; }
  #nav a:hover { color: var(--ink); text-decoration: underline;
                 text-underline-offset: 3px; }
  #nav strong { color: var(--accent); font-weight: 600; }
  /* The nav sits on the map, not on a panel, so it has to follow the ground
     like everything else drawn there - light ink vanished on the pale map. */
  body.pale #nav a { color: rgba(15, 34, 54, .66); }
  body.pale #nav a:hover { color: #0f2236; }
  body.pale #nav strong { color: #3c6b00; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center;
    color: #a9a8a2; font-size: 14px; }
  /* An explicit display beats the hidden attribute, so say so outright - the
     overlay stayed on screen over a map that had loaded perfectly well. */
  #loading[hidden] { display: none; }
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07090c">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bird Map">
</head>
<body>
<nav id="nav">
  <a href="index.html">Animation</a>
  <a href="map.html">Map</a>
  <strong>A year</strong>
</nav>
<div id="stage"><div id="frame"><canvas id="c"></canvas></div></div>
<div id="loading">Reading the migration field…</div>

<div id="bar" hidden>
  <select id="species" aria-label="Species"></select>
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" max="52" step="0.01" value="0">
  <span class="lbl" id="when">—</span>
  <button id="more" aria-label="More controls" title="More">⋯</button>
  <span id="install-slot"></span>
  <select id="basemap" aria-label="Backdrop">
    <option value="light">Light map</option>
    <option value="satellite" selected>Satellite</option>
    <option value="dark">Dark map</option>
    <option value="none">Drawn</option>
  </select>
  <span class="lbl" id="zoom"></span>
  <button id="reset" hidden>Reset</button>
  <select id="size">
    <option value="fit" selected>Fit screen</option>
    <option value="1080x1350">4:5</option>
    <option value="1080x1920">9:16</option>
    <option value="1080x1080">1:1</option>
    <option value="1920x1080">16:9</option>
  </select>
</div>

<script src="migration.js"></script>
<script src="pwa.js" defer></script>
</body>
</html>
