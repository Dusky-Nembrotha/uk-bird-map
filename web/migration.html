<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One year of migration</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #07090c; color: #f0efec; overflow: hidden;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #frame { position: relative; box-shadow: 0 24px 80px rgba(0,0,0,.6); }
  canvas { display: block; }

  #bar {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; z-index: 20;
    padding: 8px 14px; border-radius: 999px;
    background: rgba(12,14,18,.78); border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(8px);
  }
  button {
    font: inherit; color: #f0efec; background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.16); border-radius: 8px;
    padding: 5px 11px; cursor: pointer;
  }
  button:hover { background: rgba(255,255,255,.16); }
  select, input[type=range] { font: inherit; color: #f0efec; background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.16); border-radius: 8px; padding: 4px 8px; }
  input[type=range] { padding: 0; width: 190px; }
  #species { max-width: 200px; }
  .lbl { font-size: 12px; color: #a9a8a2; font-variant-numeric: tabular-nums; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center;
    color: #a9a8a2; font-size: 14px; }
  /* An explicit display beats the hidden attribute, so say so outright - the
     overlay stayed on screen over a map that had loaded perfectly well. */
  #loading[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage"><div id="frame"><canvas id="c"></canvas></div></div>
<div id="loading">Reading the migration field…</div>

<div id="bar" hidden>
  <select id="species" aria-label="Species"></select>
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" max="52" step="0.01" value="0">
  <span class="lbl" id="when">—</span>
  <select id="size">
    <option value="1080x1350" selected>4:5</option>
    <option value="1080x1920">9:16</option>
    <option value="1080x1080">1:1</option>
    <option value="1920x1080">16:9</option>
  </select>
</div>

<script src="migration.js"></script>
</body>
</html>
