<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One year of migration</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #07090c; color: #f0efec; overflow: hidden;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #frame { position: relative; box-shadow: 0 24px 80px rgba(0,0,0,.6); }
  /* Filling the screen is the normal case; a fixed export shape is the
     special one. Letterboxing a phone to 4:5 wasted half the display. */
  body.fit #frame { box-shadow: none; }
  canvas { display: block; touch-action: none; }

  #bar {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; z-index: 20;
    /* It used to be a single rigid row and ran off both edges of a phone. */
    flex-wrap: wrap; justify-content: center;
    max-width: calc(100vw - 20px);
    padding: 8px 14px; border-radius: 22px;
    background: rgba(12,14,18,.78); border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(8px);
  }
  button {
    font: inherit; color: #f0efec; background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.16); border-radius: 8px;
    padding: 5px 11px; cursor: pointer;
  }
  button:hover { background: rgba(255,255,255,.16); }
  select, input[type=range] { font: inherit; color: #f0efec; background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.16); border-radius: 8px; padding: 4px 8px; }
  input[type=range] { padding: 0; width: 190px; max-width: 46vw; }
  #species { max-width: min(200px, 44vw); }
  #nav { position: fixed; top: 14px; left: 16px; }

  @media (max-width: 620px) {
    /* Pinned to the foot of the screen rather than floating above it, and the
       secondary controls folded away behind the ellipsis - four rows of chrome
       over a map is not a viewer. */
    #bar {
      left: 0; right: 0; bottom: 0; transform: none; max-width: none;
      border-radius: 14px 14px 0 0; gap: 8px; padding: 8px 10px 10px;
      font-size: 13px;
    }
    button, select { padding: 5px 9px; }
    .lbl { font-size: 11px; }
    input[type=range] { width: 100%; order: 10; max-width: none; }
    #species { max-width: 42vw; }
    body:not(.more) #basemap,
    body:not(.more) #size { display: none; }
  }
  /* On a wide screen there is room for everything, so the toggle is noise. */
  @media (min-width: 621px) { #more { display: none; } }
  .lbl { font-size: 12px; color: #a9a8a2; font-variant-numeric: tabular-nums; }
  /* It opened as a page with no way off it. */
  #nav {
    position: fixed; top: 14px; left: 16px; z-index: 30; display: flex;
    gap: 14px; align-items: center; font-size: 13px;
  }
  #nav a { color: #a9a8a2; text-decoration: none; }
  #nav a:hover { color: #f0efec; text-decoration: underline;
                 text-underline-offset: 3px; }
  #nav strong { color: #a9e34b; font-weight: 600; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center;
    color: #a9a8a2; font-size: 14px; }
  /* An explicit display beats the hidden attribute, so say so outright - the
     overlay stayed on screen over a map that had loaded perfectly well. */
  #loading[hidden] { display: none; }
</style>
</head>
<body>
<nav id="nav">
  <a href="index.html">Animation</a>
  <a href="map.html">Map</a>
  <strong>A year</strong>
</nav>
<div id="stage"><div id="frame"><canvas id="c"></canvas></div></div>
<div id="loading">Reading the migration field…</div>

<div id="bar" hidden>
  <select id="species" aria-label="Species"></select>
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" max="52" step="0.01" value="0">
  <span class="lbl" id="when">—</span>
  <button id="more" aria-label="More controls" title="More">⋯</button>
  <select id="basemap" aria-label="Backdrop">
    <option value="light" selected>Light map</option>
    <option value="satellite">Satellite</option>
    <option value="dark">Dark map</option>
    <option value="none">Drawn</option>
  </select>
  <span class="lbl" id="zoom"></span>
  <button id="reset" hidden>Reset</button>
  <select id="size">
    <option value="fit" selected>Fit screen</option>
    <option value="1080x1350">4:5</option>
    <option value="1080x1920">9:16</option>
    <option value="1080x1080">1:1</option>
    <option value="1920x1080">16:9</option>
  </select>
</div>

<script src="migration.js"></script>
</body>
</html>
